# ===========================================================================
# Pdfding for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : mrmn/pdfding:v1.15.0 (Docker Hub, used unmodified)
#
# Ports   : host 8056 -> container 8000. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/pdfdingdocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the upstream image already runs as the non-root user 'nonroot'
#           (uid 1000); the entrypoint below only supplies a persistent
#           SECRET_KEY and tightens the data-directory permissions.
# Cookies : TOS opens the app over plain HTTP. Upstream defaults both cookie
#           flags to TRUE when the variables are absent, so a Secure session
#           cookie is issued over HTTP, the browser never sends it back and
#           login loops (review item F5). Both are therefore set to FALSE.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  pdfdingdocker:
    image: mrmn/pdfding:v1.15.0
    container_name: pdfdingdocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # TOS wrapper for the upstream PdfDing image.
        #
        # 1. Django needs a persistent SECRET_KEY. Generate it once into the data
        #    volume instead of hardcoding it in the compose file.
        # 2. The platform creates the bind-mount roots with the default 0755 mode. The
        #    database and the uploaded PDFs must not be readable by other local users,
        #    so tighten the two data directories on every start (this also repairs the
        #    permissions of an install upgraded from an older package).
        set -u
        set -e

        umask 077

        DATA_DIR=/home/nonroot/pdfding
        SECRET_FILE="$$DATA_DIR/db/.secret_key"

        mkdir -p "$$DATA_DIR/db" "$$DATA_DIR/media"

        if [ ! -s "$$SECRET_FILE" ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > "$$SECRET_FILE"
        fi
        chmod 600 "$$SECRET_FILE"

        # S11: 0700 directories and 0600 database files, owned by the app user only.
        # Ignore failures on mounts this process does not own (staging / foreign uid):
        # the container still starts, and the platform-owned directory is reported by
        # the installer instead of being silently left world-readable.
        for d in "$$DATA_DIR/db" "$$DATA_DIR/media"; do
          [ -d "$$d" ] && chmod 700 "$$d" 2>/dev/null || true
        done
        find "$$DATA_DIR/db" -maxdepth 1 -type f -exec chmod 600 {} + 2>/dev/null || true

        export SECRET_KEY="$$(cat "$$SECRET_FILE")"

        # Upstream 1.15.0 runs ./entrypoint.sh (1.7.2 used ./bootstrap.sh).
        exec ./entrypoint.sh
    ports:
      - "8056:8000"
    environment:
      TZ: "Asia/Shanghai"
      HOST_NAME: "*"
      CSRF_COOKIE_SECURE: "FALSE"
      SESSION_COOKIE_SECURE: "FALSE"
      ACCOUNT_DEFAULT_HTTP_PROTOCOL: "http"
    volumes:
      - /Volume1/DockerAppData/pdfdingdocker/db:/home/nonroot/pdfding/db
      - /Volume1/DockerAppData/pdfdingdocker/media:/home/nonroot/pdfding/media
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8056
    protocol: http
